<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pleitost mudou de endereço</title>
<meta name="robots" content="noindex">
<script>
  // Pleitost mudou para https://rpg.adrenalindos.com (03/11/2026). Mantem o caminho, a busca e o hash.
  (function () {
    var p = location.pathname.replace(/^\/pleitost-app/, "") || "/";
    var dest = "https://rpg.adrenalindos.com" + p + location.search + location.hash;
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }).finally(function () { location.replace(dest); });
    } else { location.replace(dest); }
  })();
</script>
<meta http-equiv="refresh" content="3;url=https://rpg.adrenalindos.com/">

</head>

<h1>O Pleitost mudou de endereço</h1>
<p>Agora ele fica em <a href="https://rpg.adrenalindos.com/">rpg.adrenalindos.com</a>. Você está sendo levado para lá; atualize o seu atalho.</p>
</body>
</html>
